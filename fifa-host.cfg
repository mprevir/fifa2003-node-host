[host]
# Replace this example with the folder containing fifa2003.exe.
game_dir = D:/Games/FIFA 2003

# Replace this example with your Windows LAN IPv4 address. Leave blank for host-only play.
# The example below serves the game at https://192.168.20.3:8443/.
lan_ip = 192.168.20.3

# Leave blank to use Caddy on PATH, or enter a portable executable path.
# caddy_path = D:/Tools/caddy.exe
caddy_path =

[boxedwine]
# Directory containing boxedwine.html, boxedwine.js, boxedwine.wasm, and related files.
runtime_url = https://boxedwine.org/builds/demos/build/master/138/st-jit/

# URL of the Wine filesystem ZIP. Downloads must match runtime-lock.json.
filesystem_url = https://boxedwine.org/v2/41/TinyCore15Wine11.0-web.zip
