[host]
# Folder containing fifa2003.exe. Relative paths start at this config file.
game_dir = game

# Windows LAN IPv4 address. Leave blank to play on the host only.
lan_ip =

# Optional path to a portable Caddy executable. Leave blank to use PATH.
caddy_path =

[boxedwine]
# Directory containing boxedwine.html, boxedwine.js, boxedwine.wasm, and related files.
runtime_url = https://boxedwine.org/builds/demos/build/master/138/st-jit/

# URL of the Wine filesystem ZIP. Downloads must match runtime-lock.json.
filesystem_url = https://boxedwine.org/v2/41/TinyCore15Wine11.0-web.zip
